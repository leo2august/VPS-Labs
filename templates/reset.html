<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08111f"><title>Reset password · Labs</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 80% 0,#254a7044,transparent 35rem),#07101d;color:#edf5ff;font:15px/1.5 system-ui}.box{width:min(100%,440px);padding:32px;border:1px solid #2e425d;border-radius:23px;background:linear-gradient(145deg,#102039,#0c1829);box-shadow:0 28px 80px #0008}.seal{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:#f7f0e7;color:#d95059;font:700 21px serif}h1{margin:24px 0 6px;font:700 34px Georgia,serif}p{color:#9eb1ca}.err{padding:10px 12px;border:1px solid #ef626855;border-radius:10px;background:#ef626818;color:#ffb4b8}label{display:block;margin:16px 0 6px;color:#b9c9dc;font-size:11px;font-weight:800}input{width:100%;height:50px;padding:0 14px;border:1px solid #2a3e59;border-radius:12px;background:#071321;color:white;outline:none}input:focus{border-color:#55a9df;box-shadow:0 0 0 4px #55a9df1c}button{width:100%;height:52px;margin-top:20px;border:1px solid #4977a4;border-radius:12px;background:linear-gradient(135deg,#4289c4,#28557f);color:white;font-weight:850;cursor:pointer}.note{font-size:11px}</style></head><body><main class="box"><div class="seal">鍵</div><h1>Password baru.</h1><p>Tautan satu kali. Minimal 10 karakter, berisi huruf dan angka.</p>{% if error %}<div class="err">{{ error }}</div>{% endif %}<form method="post"><label>PASSWORD BARU</label><input name="password" type="password" minlength="10" autocomplete="new-password" required><label>ULANGI PASSWORD</label><input name="password2" type="password" minlength="10" autocomplete="new-password" required><button>Ubah password Labs</button></form><p class="note">Tautan kedaluwarsa setelah 15 menit.</p></main></body></html>
